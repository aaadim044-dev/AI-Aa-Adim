<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AA ADIM AI</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--side:#eef0f7;--text:#14172b;--mute:#6b7089;--line:#dfe2ee;--acc:#6d5efc;--acc2:#19c3e6;--user:#6d5efc;--ubt:#fff;--ai:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1a;--panel:#151829;--side:#10121f;--text:#eceefb;--mute:#8d92b0;--line:#252a45;--ai:#151829;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f1a;--panel:#151829;--side:#10121f;--text:#eceefb;--mute:#8d92b0;--line:#252a45;--ai:#151829;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{display:flex;height:100%}
aside{width:280px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;transition:transform .25s;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;text-align:left}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;font-weight:600}
input.s{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;width:100%}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.it{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;cursor:pointer}
.it:hover,.it.on{background:var(--panel)}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it b{opacity:.5;font-weight:400;border:0;background:none;padding:2px 6px}.it b:hover{opacity:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;flex:1}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:9px;width:36px;height:36px}
#menu{display:none}
#msgs{flex:1;overflow:auto;padding:18px 14px}
.w{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.m{display:flex;flex-direction:column;gap:4px;max-width:100%}
.m.u{align-items:flex-end}
.bub{padding:11px 14px;border-radius:16px;max-width:88%;overflow-wrap:anywhere;white-space:pre-wrap}
.u .bub{background:var(--user);color:var(--ubt);border-bottom-right-radius:4px}
.a .bub{background:var(--ai);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub pre{background:rgba(120,120,160,.15);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;white-space:pre}
.bub code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.act{display:flex;gap:6px}.act button{border:0;background:none;color:var(--mute);font-size:12.5px;padding:2px 4px}.act button:hover{color:var(--acc)}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--acc);animation:b 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.hero{text-align:center;margin:8vh auto 0;max-width:560px}
.hero .lg{width:60px;height:60px;border-radius:18px;font-size:22px;margin:0 auto 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px}
.chips button:hover{border-color:var(--acc);color:var(--acc)}
.bar{padding:10px 14px 14px;background:var(--bg)}
.box{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
textarea{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;resize:none;max-height:150px;padding:6px 8px}
.send{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;border-radius:12px;width:40px;height:40px;font-size:18px}
.send:disabled{opacity:.5}
.note{text-align:center;color:var(--mute);font-size:12px;margin-top:6px}
.err{color:#d63b55}
@media(max-width:760px){aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.25);padding-top:calc(14px + env(safe-area-inset-top,0px))}aside.open{transform:none}#menu{display:block}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="logo"><div class="lg">AA</div>AA ADIM AI</div>
  <button class="btn pri" id="new">+ Percakapan baru</button>
  <input class="s" id="q" placeholder="Cari riwayat…">
  <div class="list" id="list"></div>
  <button class="btn" id="theme">🌓 Ganti tema</button>
</aside>
<main>
  <header><button class="ib" id="menu">☰</button><h1 id="ttl">AA ADIM AI</h1></header>
  <div id="msgs"><div class="w" id="w"></div></div>
  <div class="bar">
    <div class="box">
      <button class="ib" id="mic" title="Bicara" style="display:none">🎤</button>
      <textarea id="in" rows="1" placeholder="Tulis pesan…"></textarea>
      <button class="send" id="go" title="Kirim">➤</button>
    </div>
    <div class="note">AA ADIM AI bisa keliru. Periksa kembali informasi penting.</div>
  </div>
</main>
</div>
<script>
const HELLO="Halo! Saya AA ADIM AI. Asisten cerdas yang siap membantu kamu belajar, berkarya, mencari ide, dan menyelesaikan berbagai persoalan. Ada yang bisa saya bantu hari ini?";
const CHIPS=["Bantu saya belajar.","Buatkan ide bisnis.","Jelaskan sesuatu kepada saya.","Bantu saya membuat tulisan.","Diskusikan ide kreatif."];
const $=id=>document.getElementById(id);
let chats=[],cur=null,busy=false;
try{chats=JSON.parse(localStorage.getItem("aa_chats")||"[]")}catch(e){}
try{const t=localStorage.getItem("aa_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const save=()=>{try{localStorage.setItem("aa_chats",JSON.stringify(chats))}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function md(s){s=esc(s);s=s.replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>"<pre><code>"+c+"</code></pre>");
 s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");return s}
const chat=()=>chats.find(c=>c.id===cur);
function renderList(){const k=$("q").value.toLowerCase();$("list").innerHTML="";
 chats.filter(c=>!k||c.title.toLowerCase().includes(k)||c.msgs.some(m=>m.content.toLowerCase().includes(k))).forEach(c=>{
  const d=document.createElement("div");d.className="it"+(c.id===cur?" on":"");
  const s=document.createElement("span");s.textContent=c.title;
  const x=document.createElement("b");x.textContent="🗑";x.title="Hapus";
  x.onclick=e=>{e.stopPropagation();chats=chats.filter(z=>z.id!==c.id);if(cur===c.id)cur=null;save();render()};
  d.onclick=()=>{cur=c.id;$("side").classList.remove("open");render()};
  d.append(s,x);$("list").append(d)})}
function render(){renderList();const c=chat(),w=$("w");w.innerHTML="";$("ttl").textContent=c?c.title:"AA ADIM AI";
 if(!c||!c.msgs.length){const h=document.createElement("div");h.className="hero";
  h.innerHTML='<div class="lg">AA</div><p></p><div class="chips"></div>';h.querySelector("p").textContent=HELLO;
  CHIPS.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>send(t);h.querySelector(".chips").append(b)});
  w.append(h);return}
 c.msgs.forEach((m,i)=>{const e=document.createElement("div");e.className="m "+(m.role==="user"?"u":"a");
  const b=document.createElement("div");b.className="bub";
  if(m.role==="user")b.textContent=m.content;else if(m.err){b.className+=" err";b.textContent=m.content}
  else if(!m.content)b.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';else b.innerHTML=md(m.content);
  e.append(b);
  if(m.content&&!(busy&&i===c.msgs.length-1)){const a=document.createElement("div");a.className="act";
   const add=(t,f)=>{const x=document.createElement("button");x.textContent=t;x.onclick=()=>f(x);a.append(x)};
   if(m.role==="user")add("✏️ Edit",()=>{c.msgs=c.msgs.slice(0,i);$("in").value=m.content;save();render();$("in").focus()});
   else{add("📋 Salin",x=>{try{navigator.clipboard.writeText(m.content);x.textContent="✓ Tersalin"}catch(e){}});
    add("🔊 Baca",()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(m.content))});
    if(i===c.msgs.length-1)add("🔄 Ulangi",()=>{c.msgs.pop();run()})}
   e.append(a)}
  w.append(e)});
 $("msgs").scrollTop=$("msgs").scrollHeight}
async function run(){const c=chat();if(!c)return;
 busy=true;$("go").disabled=true;const am={role:"assistant",content:""};c.msgs.push(am);render();
 try{
  const h=c.msgs.slice(0,-1).map(m=>({role:m.role,content:m.content}));
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:h})});
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(j.error||"Server error "+r.status)}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
   const lines=buf.split("\n");buf=lines.pop();
   for(const l of lines){if(!l.startsWith("data:"))continue;try{const j=JSON.parse(l.slice(5));if(j.type==="content_block_delta"&&j.delta&&j.delta.text){am.content+=j.delta.text;render()}}catch(e){}}}
 }catch(e){if(!am.content){am.err=true;am.content="⚠️ "+(e.message||"Terjadi kesalahan.")}}
 busy=false;$("go").disabled=false;save();render()}
function send(t){t=(t||$("in").value).trim();if(!t||busy)return;
 if(!chat()){const c={id:Date.now()+"",title:t.slice(0,40),msgs:[]};chats.unshift(c);cur=c.id}
 chat().msgs.push({role:"user",content:t});$("in").value="";$("in").style.height="auto";run()}
$("go").onclick=()=>send();
$("in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("in").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"});
$("new").onclick=()=>{cur=null;$("side").classList.remove("open");render()};
$("q").oninput=renderList;$("menu").onclick=()=>$("side").classList.toggle("open");
$("theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("aa_theme",r.dataset.theme)}catch(e){}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const m=$("mic");m.style.display="";const rc=new SR();rc.lang="id-ID";let on=false;
 rc.onresult=e=>{$("in").value+=(($("in").value?" ":"")+e.results[0][0].transcript)};
 rc.onend=()=>{on=false;m.textContent="🎤"};
 m.onclick=()=>{if(on){rc.stop();return}try{rc.start();on=true;m.textContent="⏹"}catch(e){}}}
render();
</script>
</body>
</html>
